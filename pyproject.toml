[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncm-moe-engram-kvcache"
version = "0.1.0"
description = "NCM Generator with MoE Paging, Engram Memory, and Bounded KV Cache"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "torchaudio>=2.3.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "numpy>=1.24.0",
    "transformers>=4.51.0",
    "huggingface-hub>=0.23.0",
    "safetensors>=0.4.0",
    "tokenizers>=0.19.0",
    "regex>=2024.0.0",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4.0",
    "aiofiles>=23.0.0",
    "xxhash>=3.4.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
]
cuda121 = [
    "torch>=2.3.0+cu121",
    "torchvision>=0.18.0+cu121",
    "torchaudio>=2.3.0+cu121",
]

[project.urls]
Homepage = "https://github.com/your-repo/ncm-moe-engram-kvcache"
Repository = "https://github.com/your-repo/ncm-moe-engram-kvcache"
Issues = "https://github.com/your-repo/ncm-moe-engram-kvcache/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "training*", "utils*", "tokenization*"]

[tool.pytest.ini_options]
testpaths = ["training"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.py$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]
exclude = [".git", ".venv", "build", "dist"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true