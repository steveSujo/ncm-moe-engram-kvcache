training:
  batch_size: 4
  grad_accum: 8
  max_steps: 50000
  checkpoint_every: 1000
  eval_every: 500
  log_every: 10
  
  # Two-timescale optimizer
  optimizer:
    trunk_lr: 3e-4      # attention, embeddings
    engram_lr: 1e-4     # engram tables
    expert_lr: 3e-3     # MoE experts
    weight_decay: 0.1
    betas: [0.9, 0.95]
    eps: 1e-8
  
  # Gradient clipping
  grad_clip: 1.0
  
  # Mixed precision
  amp: true
  dtype: bfloat16
  
  # Curriculum
  curriculum:
    enabled: true
    warmup_steps: 1000
    difficulty_schedule: "linear"
  
  # Feedback integration
  feedback:
    enabled: true
    feedback_path: "data/feedback_loop/"
    mix_ratio: 0.3  # fraction of batch from feedback
    
  # Schema version
  schema_version: "1.0.0"